server {
    listen 80;
    listen [::]:80;
    server_name vms.time88.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vms.time88.in;

    ssl_certificate /etc/letsencrypt/live/vms.time88.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vms.time88.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/public/webhooks/msg91/dlr {
        access_log off;
        proxy_pass http://127.0.0.1:5016;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ^~ /appointment/register/ {
        access_log off;
        proxy_pass http://127.0.0.1:5016;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ^~ /appointment-pass/ {
        access_log off;
        proxy_pass http://127.0.0.1:5016;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5016;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:5016;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
